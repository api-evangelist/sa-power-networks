name: SA Power Networks
kind: company
description: >-
  SA Power Networks is South Australia's sole electricity distributor —
  the poles-and-wires DNSP that builds, maintains and upgrades the network delivering
  power to around 900,000 homes and businesses, and the operator of the state's
  Flexible Exports dynamic solar export scheme. It sits between the transmission
  network and the retailers, holding meter data, network capacity data and DER
  connection data but selling nothing to consumers directly. Its API posture is
  empty by design: Australia's Consumer Data Right was extended to energy and is
  live, but the designation names electricity retailers as primary data holders and
  AEMO as the secondary data holder — distributors are not designated, and SA Power
  Networks does not appear among the 84 brands on the live CDR energy register.
  There is no developer portal, no documented API, and no machine-readable contract
  of any kind. Third parties reach a customer's meter data only by registering as an
  Authorised Representative and logging into a web portal; network capacity is a
  registration-gated map viewer; the genuinely open surface is bulk file downloads
  (zone substation data, the Distribution Annual Planning Report, the embedded
  generation register) that anyone can pull anonymously but that carry a
  redistribution restriction rather than an open licence.
