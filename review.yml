sources:
  - url: https://www.sapowernetworks.com.au/about-us/our-role/
    type: About
    httpStatus: 200
    note: >-
      States SA Power Networks is "the state's sole electricity distributor" and
      that it maintains "the poles, wires and substations that deliver power to
      around 900,000 homes and businesses".
  - url: https://www.sapowernetworks.com.au/industry/
    type: Documentation
    httpStatus: 200
    note: >-
      The industry landing page — the closest thing to a partner hub. 18 links,
      all human workflows (permits, portals, tenders, standards). No API,
      developer or open-data reference.
  - url: https://www.sapowernetworks.com.au/industry/access-your-clients-meter-data/
    type: Documentation
    httpStatus: 200
    note: Authorised Representative registration + portal login. The consumer-data path.
  - url: https://www.sapowernetworks.com.au/industry/annual-network-plans/
    type: Data
    httpStatus: 200
    note: DAPR, system limitation templates, embedded generation register. Files only.
  - url: https://www.sapowernetworks.com.au/data/324688/2024-2025-zone-substation-data/
    type: Data
    httpStatus: 200
    note: Anonymous 34 MB ZIP. The one unambiguously open surface.
  - url: https://dapr.sapowernetworks.com.au/
    type: Portal
    httpStatus: 200
    note: Network Visualisation Portal, AWS Cognito self-serve registration.
  - url: https://www.sapowernetworks.com.au/data/315234/new-network-visualisation-portal-launched/
    type: Blog
    httpStatus: 200
    note: >-
      Announces the portal, states it "is available to all customers" after
      "simple registration", and makes no mention of data downloads, API access or
      licensing.
  - url: https://api.cdr.gov.au/cdr-register/v1/energy/data-holders/brands/summary
    type: Registry
    httpStatus: 200
    note: >-
      The live Australian CDR Register. 84 energy data-holder brands, all
      retailers, zero distributors. This single anonymous call is the load-bearing
      evidence for the mandate finding.
  - url: https://arena.gov.au/assets/2024/01/SA-Power-Networks-Flexible-Exports-for-Solar-PV-Trial-Final-Report.pdf
    type: Report
    httpStatus: 200
    note: >-
      Third-party (ARENA) documentation of the IEEE 2030.5 / CSIP-AUS utility
      server operated for SA Power Networks. External evidence only — SA Power
      Networks itself never names the protocol.

actions:
  apisListed: 0
  apisYmlCreated: true
  openapiHarvested: false
  specsCount: 0
  reason: >-
    apis[] is empty because nothing real exists to list. No OpenAPI, AsyncAPI,
    GraphQL, Postman collection, JSON Schema or MCP descriptor was found or
    fabricated. The company's entire integration surface is web portals and file
    downloads, and this profile records exactly that.
