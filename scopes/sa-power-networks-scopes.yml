caveat: >-
  These are the scopes advertised by the Salesforce Experience Cloud identity
  provider that fronts the "Your Meter Data" portal — the stock Salesforce platform
  scope set, published by the vendor platform rather than designed by SA Power
  Networks. SA Power Networks documents no scope model of its own, publishes no
  scope reference page, and exposes no API for these scopes to authorize. They are
  recorded because they are genuinely published and anonymously retrievable, not
  because they represent an SA Power Networks authorization contract.
