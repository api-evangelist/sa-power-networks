summary: >-
  There is no API lifecycle to record. SA Power Networks publishes no API, and
  therefore no versioning scheme, no deprecation policy, no Sunset/Deprecation
  header behaviour, no API SLA and no API status page. What it does publish is a
  document lifecycle (annually re-issued datasets and technical standards) and a
  customer-facing network outage map. Both are recorded here as the honest analogue,
  and neither is wired as a StatusPage or Deprecation pointer, because neither is
  about an API.
