    No base URI, no interface specification, no certificate/mTLS onboarding guide and
    no test harness is published by SA Power Networks for its utility server. Peer
    DNSPs (Energex, United Energy, Powercor/CitiPower, Essential Energy, Synergy)
    publish a CSIP-AUS "Utility Interconnection Handbook"; SA Power Networks — the
    DNSP that originated CSIP-AUS — publishes none. Integration runs through
    inverter-manufacturer certification and a phone number (13 12 61).
- id: csip-aus
  name: Common Smart Inverter Profile — Australia (SA HB 218 / SA TS 5573)
  conforms: true
  scope: Flexible Exports dynamic operating envelopes
  evidence: >-
    SA Power Networks' Lessons Learnt Report 2 documents the project team drafting
    CSIP-AUS with the DER API technical working group; the draft became Standards
    Australia handbook SA HB 218 and is now maintained as SA TS 5573. Lesson #4 of
    that report is specifically about the limits of the CSIP implementation guide.
  note: >-
    Conformance is asserted from SA Power Networks' own trial documentation, not from
    a certification listing. No CSIP-AUS server test result is published by the company.
