summary: >-
  SA Power Networks conforms to no API-layer standard because it operates no API.
  What it does conform to — and this is the round-two correction to the record — is
  IEEE 2030.5 via the Australian Common Smart Inverter Profile (CSIP-AUS), and it
  names that protocol in its own published documents. Round one concluded "no
  standard reference found in any SA Power Networks publication"; that was drawn
  from the connection standards (TS129) and the Flexible Exports product pages,
  where it holds. It does not hold for the four Flexible Exports Lessons Learnt
  reports SA Power Networks publishes on its own domain, which name IEEE 2030.5 and
  CSIP-AUS explicitly and describe the utility-server integration architecture.
  The protocol is documented; the endpoint, the onboarding path and the interface
  specification still are not.
standards:
