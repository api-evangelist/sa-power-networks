    (published at sapowernetworks.com.au) names IEEE 2030.5 twelve times, including
    "Several different IEEE 2030.5 compliant integration architectures could enable
    communication between the server and customer equipment" and "Segregation of
    devices across multiple network areas (and multiple IEEE 2030.5 utility servers)".
    Report 2 states the project team "developed an early draft of the Australian
    adaptation of CSIP (CSIP-AUS) ... to ensure consistency across IEEE 2030.5
    dynamic operating envelope implementations in Australia".
